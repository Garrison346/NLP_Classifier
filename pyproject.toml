[project]
name = "nlp-classifier"
version = "0.1.0"
description = "An NLP-based chatbot using statistical and traditional machine-learning techniques for intent classification and document analysis."
readme = "README.md"
authors = [
    { name = "Garrison"}
]
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.6.0",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pypdf>=6.21.4",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
]

[project.scripts]
nlp-classifier = "nlp_classifier.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
